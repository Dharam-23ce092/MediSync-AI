<header class="topbar-container">
  <!-- Left Side: Portal workspace indicator -->
  <div class="topbar-left">
    <div class="workspace-indicator">
      <span class="workspace-pulse"></span>
      <h2 class="workspace-title">{{ portalName() }}</h2>
    </div>
  </div>

  <!-- Center: Search block -->
  <div class="topbar-center">
    <div class="global-search-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="text"
        placeholder="Search cases by patient, UHID or case number"
        #caseSearch (keyup.enter)="search(caseSearch.value)" aria-label="Search cases"
        class="global-search-input"
        appTooltip="Search across all modules using patient IDs or names"
        tooltipPosition="bottom"
      />
    </div>
  </div>

  <!-- Right Side: Actions -->
  <div class="topbar-right">
    <!-- Theme Toggle Button -->
    <button
      class="theme-toggle-btn"
      type="button"
      (click)="themeService.toggleTheme()"
      [attr.aria-label]="themeService.isLight() ? 'Switch to Dark Mode' : 'Switch to Light Mode'"
      [appTooltip]="themeService.isLight() ? 'Switch to Dark Theme' : 'Switch to Light Theme'"
      tooltipPosition="bottom"
    >
      <svg *ngIf="themeService.isLight()" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-moon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      <svg *ngIf="!themeService.isLight()" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-sun"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </button>

    <!-- Notification trigger -->
    <div class="notification-trigger-wrapper">
      <button
        class="icon-action-btn"
        (click)="toggleNotifications()"
        appTooltip="System notifications and critical alerts"
        tooltipPosition="bottom"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="count-badge" *ngIf="notificationCount() > 0">
          {{ notificationCount() }}
        </span>
      </button>

      <!-- Notification Dropdown -->
      <div class="notification-dropdown" *ngIf="showNotifications()">
        <div class="dropdown-header">
          <span>Notifications</span>
          <button class="clear-all-btn" (click)="showNotifications.set(false)">Close</button>
        </div>
        <div class="dropdown-body">
          <a class="notification-item" *ngFor="let a of notifications()" [routerLink]="['/cases',a.caseId]" (click)="showNotifications.set(false)">
            <div class="item-content"><div class="item-title">{{ a.status }} · {{ a.name }}</div><div class="item-text">{{ a.caseNumber }} · {{ a.appointmentTime | date:'short' }}</div></div>
          </a>
          <p *ngIf="!notifications().length">No active appointment updates.</p>
        </div>
      </div>
    </div>

    <!-- Sign Out Button -->
    <button
      class="logout-btn"
      (click)="logout()"
      appTooltip="Sign out of your clinical session"
      tooltipPosition="bottom"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      Sign Out
    </button>

    <!-- Quick profile details -->
    <div class="profile-preview-wrapper" *ngIf="authService.currentUser() as user" appTooltip="Logged in profile details" tooltipPosition="left">
      <div class="profile-avatar">
        {{ user.name.charAt(0) }}
      </div>
      <div class="profile-text">
        <span class="profile-name">{{ user.name }}</span>
        <span class="profile-role">{{ user.role }}</span>
      </div>
    </div>
  </div>
</header>
