<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#121214" />
    </linearGradient>
  </defs>
  <!-- Background rounded card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#2E2E33" stroke-width="1.5" />
  
  <!-- Clinical Cross Background Glow -->
  <path d="M 32 14 L 32 50 M 14 32 L 50 32" stroke="rgba(14, 165, 233, 0.15)" stroke-width="8" stroke-linecap="round" />

  <!-- Heartbeat ECG Pulse Waveform -->
  <path d="M 10 33 L 20 33 L 25 19 L 32 46 L 39 23 L 44 36 L 48 33 L 54 33" fill="none" stroke="url(#grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Live Status Glowing Dot -->
  <circle cx="50" cy="15" r="3.5" fill="#38BDF8" />
  <circle cx="50" cy="15" r="5" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
</svg>
